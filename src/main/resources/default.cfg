# LWNRDB default configuration.
# Lines starting with '#' and blank lines are ignored.
# Values defined here are used as fallbacks when a key is missing from lwnrdb.cfg.
# All of these values are validated at startup; if any value is invalid the
# application logs a FATAL error and refuses to start.

# TCP port the server listens on. Valid number between 1 and 65535.
port=8989

# Maximum number of simultaneous client connections.
# Valid number >= 0. 0 means unlimited connections.
maxConnections=100

# Directory where database files are stored. Must be a writable path.
filePath=db

# Number of background worker threads for index/admin updates. Valid number >= 1.
backgroundProcessingThreads=10

# Directory where log files are stored. Must be a writable path.
logPath=logs

# Maximum number of log files to keep. Valid number >= 1.
maxLogFiles=7

# Maximum size of a single page file. Human-readable (e.g. 2Mb, 512Kb).
# Must be a valid size > 0 and strictly greater than maxEntrySize.
maxPageSize=2Mb

# Maximum size of a single stored document. Human-readable (e.g. 1Mb).
# Must be a valid size > 0 and strictly smaller than maxPageSize.
maxEntrySize=1Mb

# Bootstrap admin credentials. Both are required.
# defaultAdminUsername must be a non-blank string.
defaultAdminUsername=admin
# defaultAdminPassword must be at least 8 characters.
defaultAdminPassword=administrator

# JVM heap-used budget for caching. Human-readable (e.g. 512Mb, 2Gb).
# Special values: 0 = unlimited (no eviction), -1 = caching disabled.
maxMemory=512mb

# How long (in milliseconds) a write inside a transaction waits to acquire a busy
# collection's write lock before the transaction is aborted (409-5). Bounds lock
# contention so two concurrent transactions cannot deadlock. Valid number >= 1.
transactionLockTimeoutMs=5000

# Total wall-clock budget (ms) for a graceful shutdown: refusing new connections, releasing
# open transactions, and letting the trigger and background-index queues finish. Work still
# outstanding when it expires is abandoned with a warning naming what was dropped. Keep it
# below the SIGKILL grace period of whatever supervises the process. Valid number >= 1.
shutdownTimeoutMs=15000

# Enable TLS for all client connections. true/false.
# When true, every connection is encrypted and plaintext clients are rejected
# at the TLS handshake.
tlsEnabled=false

# Path to a PKCS12 keystore (.p12) holding the server's private key and certificate.
# Used only when tlsEnabled=true. If the file does not exist, a self-signed keystore
# is generated here at startup (with a SECURITY WARNING) for development use only.
tlsKeystorePath=certs/lwnrdb.p12

# Password protecting the PKCS12 keystore. Required (non-blank) when tlsEnabled=true.
tlsKeystorePassword=change_it

# --- Clustering (multi-node) ---
# All cluster keys below are ignored unless clusterEnabled=true.

# Enable multi-node clustering. true/false. When false the node runs standalone.
clusterEnabled=false

# TCP port used for node-to-node communication. Must differ from port. 1-65535.
clusterPort=9990

# Interface the cluster server binds to.
clusterBindAddress=0.0.0.0

# Address other nodes use to reach this node (host or ip). Set to a reachable
# hostname/ip in real deployments; 127.0.0.1 only works for a single-host cluster.
clusterAdvertisedAddress=127.0.0.1

# Comma-separated list of seed nodes to join through, each as host:port.
# Leave empty on the very first node of a new cluster.
clusterSeeds=

# Stable identity of this node. Leave empty to auto-generate and persist one under
# filePath/cluster/node.id.
nodeId=

# Baseline cluster size used for the write-quorum majority calculation until
# membership stabilizes. Valid number >= 1.
clusterExpectedSize=1

# Gossip/heartbeat cadence in milliseconds. Valid number >= 1.
gossipIntervalMs=1000

# Milliseconds without hearing from a node before it is marked SUSPECT. >= 1.
suspectTimeoutMs=5000

# Milliseconds without hearing from a node before it is marked DEAD (triggers
# ownership reassignment). Must be greater than suspectTimeoutMs. >= 1.
deadTimeoutMs=15000

# Max milliseconds a write waits for the replication quorum before failing. >= 1.
replicationAckTimeoutMs=5000

# Virtual nodes per physical node on the consistent-hash ring. Higher = smoother
# distribution and less reshuffle on membership change. Valid number >= 1.
virtualNodesPerNode=128

# When a collection's owner is unreachable, serve reads from the local (full)
# replica instead of failing. true/false.
readFallbackToLocal=true

# Whether a script (RUN_SCRIPT/CALL_PROCEDURE) may be forwarded to another node for
# execution, chosen by current script load rather than by ownership. On by default, so
# one node cannot end up running every script in the cluster; set false to keep a script
# on the node that received it. Only a node that is alive and caught up on admin metadata
# is chosen. Placement spreads interpreter CPU, not data locality: the chosen node is
# usually not the owner of the collections the script touches, so each operation still
# costs a round trip - turn it off when scripts do many small reads and the client already
# connects to the right node. Roll every node when upgrading (an older peer reports no
# load at all) before the first script runs. true/false.
scriptRoutingEnabled=true

# TLS-encrypt the node-to-node channel (reuses the keystore machinery). true/false.
clusterTlsEnabled=false

# Shared secret authenticating the cluster channel. Required (non-blank) when
# clusterEnabled=true.
clusterSecret=

# How often (ms) each node runs a background anti-entropy sweep, reconciling its
# collections against live peers (in addition to reconciling on membership change).
# Catches replicas left behind by a replication timeout. Valid number >= 1.
antiEntropyIntervalMs=60000

# How long (ms) delete tombstones are retained before anti-entropy garbage-collects
# them. Must comfortably exceed the longest expected node downtime so a delete is
# never collected before every replica has converged on it. Valid number >= 1.
tombstoneRetentionMs=86400000

# The IANA time zone a stored script's Date/Temporal/toLocaleString answers in.
# Fixed rather than the JVM default so the same script returns the same answer on
# every cluster node. Must be a valid ZoneId (e.g. UTC, Europe/Madrid, +05:30).
scriptTimeZone=UTC

# The BCP 47 language tag a stored script's locale-sensitive formatting and
# collation use (e.g. en-US). Must round-trip through Locale.forLanguageTag.
scriptLocale=en-US

# Whether clients may run scripts at all (the RUN_SCRIPT operation, and installing or
# calling a stored procedure). true/false. On by default. A script executes code inside the
# database process, so it is bounded by the server-fixed sandbox below (never a
# client-supplied one) and by permissions: only an admin, a database owner, or a user
# holding scriptPermissions for that database may start one, and every operation the script
# issues is authorized again on its own request. Turn it off to refuse the operations
# outright (403-2).
scriptsEnabled=true

# Max interpreter instructions a single script may execute before it is aborted
# (400-11). Valid number >= 1.
scriptInstructionBudget=10000000

# Max wall-clock milliseconds a single script may run before it is aborted (408-1).
# Valid number >= 1.
scriptTimeoutMs=5000

# Max nested call depth a script may reach before it is aborted (400-11). Guards the
# interpreter's own Java stack. Valid number >= 1.
scriptMaxDepth=200

# Max size of the script source accepted in a RUN_SCRIPT request (400-10).
# Human-readable size > 0.
scriptMaxSourceBytes=256Kb

# Max console lines returned with a script's response. The newest lines are kept and
# the response reports whether anything was dropped. Valid number >= 1.
scriptMaxLogLines=1000

# Max characters kept per returned console line; longer lines are clipped.
# Valid number >= 1.
scriptMaxLogLineChars=4096

# Max bulk memory a single script run may allocate before it is aborted (400-12).
# Bounds the allocations that are proportional to a script-supplied length - a huge
# repeat/padStart, a dense array, a typed array, a join - which the instruction
# budget cannot see because they allocate O(N) in one instruction. Ordinary small
# allocations are bounded by scriptInstructionBudget instead.
scriptMaxMemoryBytes=64Mb

# Whether a script may evaluate a string as a module through the "script" built-in
# module's importText. Off by default. true/false.
scriptTextImportEnabled=false

# Whether a script may import a stored procedure as a module, with
# import ... from "procedures/<name>". On by default, unlike scriptTextImportEnabled:
# importText evaluates a caller-supplied string, whereas a procedure import evaluates
# code only SAVE_PROCEDURE could have installed (admin, database owner, or a MANAGE
# script grant) - the same trust boundary CALL_PROCEDURE already runs on. Only the
# script's own database is searched, and a disabled procedure is not importable. The
# key is here so an operator can freeze the import surface, not because importing
# needs opting into. true/false.
scriptProcedureImportEnabled=true

# Max size of the value a script returns, estimated before it is serialised. A run
# whose result is larger fails with 400-15 (its console output still comes back).
# Human-readable size > 0.
scriptMaxResultBytes=16Mb

# Default number of documents db.cursor fetches per batch when the caller supplies
# no batchSize. Valid number >= 1.
scriptCursorBatchSize=500

# Upper clamp for a caller-supplied db.cursor batchSize, so one call cannot
# materialise an unbounded batch. Valid number >= scriptCursorBatchSize.
scriptCursorMaxBatchSize=5000

# Compiled stored procedures retained per node, so a repeated CALL_PROCEDURE does not
# re-parse the source. Keyed by procedure version, so a save can never serve a stale
# entry. 0 disables caching and compiles on every call.
procedureCacheSize=128

# Memory bound on the cached source of stored procedures. These metadata caches are
# derived from disk and evicted least-recently-used, so lowering this only costs a
# re-read. Human-readable size > 0. Note this budget is SEPARATE from maxMemory, which
# bounds the user document/index cache only.
procedureCacheMaxBytes=32Mb

# Memory bound on the cached per-collection JSON Schemas. Same contract as
# procedureCacheMaxBytes. Human-readable size > 0.
schemaCacheMaxBytes=32Mb

# Max collections whose trigger list is kept in memory. A trigger list is small and read
# on every committed write to its collection, so this is bounded by count rather than by
# bytes. Valid number >= 0; 0 disables the cache and reads from disk every time.
triggerCacheMaxEntries=4096

# Max remembered "this procedure/schema does not exist" answers. Kept apart from the
# caches above so a caller asking for thousands of nonexistent names cannot evict the
# procedures and schemas actually in use. Valid number >= 0.
metadataMissCacheMaxEntries=4096

# Whether committed writes fire triggers. true/false. Off by default and separate from
# scriptsEnabled: a trigger runs code with no client asking for it, which is a larger
# posture change than letting a client run its own script. Trigger DDL still works when
# this is off - nothing fires.
triggersEnabled=false

# Workers on the trigger executor. Deliberately its own pool rather than the background
# index queue: a slow trigger there would stall field-index maintenance for every
# collection.
triggerThreads=2

# Bounded trigger queue. On overflow the oldest queued event is dropped with a warning
# and counted in GET_DATABASE_STATS, rather than blocking the write that fired it.
triggerQueueSize=10000

# How deep a chain of trigger-fired writes may go. A write issued by a trigger at this
# depth fires nothing. Note that a trigger with allowCascade=false (the default) already
# fires nothing at any depth above 0.
triggerMaxDepth=3

# Max wall-clock milliseconds a single trigger run may take. Tighter than scriptTimeoutMs
# because nobody is waiting on the result and the queue behind it is bounded.
triggerTimeoutMs=1000

# Whether a fired trigger is recorded durably before it runs, so a run queued when the
# process dies is replayed at startup instead of being lost. true/false. The run's effects
# and the consumption of its record commit together, so a replay cannot apply a run twice -
# turning this off trades that guarantee for one less admin write per fired trigger.
triggerRunLogEnabled=true

# How long (ms) a pending trigger run record is kept before it is garbage-collected as
# stranded (its collection was dropped, or its node never came back). Valid number >= 1.
triggerRunRetentionMs=86400000

# Whether schedules fire. true/false. On by default, and separate from scriptsEnabled and
# triggersEnabled: a scheduled run executes code on a clock, with no client asking for it
# and with its installer's authority. Enabling it costs a ticker thread and nothing else
# until somebody installs a schedule - and installing one requires scriptsEnabled, since a
# schedule can only name a stored procedure. Turn it off to refuse the three schedule
# operations outright (403-2) and stop anything already installed from firing.
schedulesEnabled=true

# Workers running scheduled procedures. Its own pool rather than the trigger executor's,
# for the same reason the trigger executor is not on the background index queue: a
# scheduled job may hold a worker for its whole timeout.
scheduleThreads=2

# Bounded queue of due runs. On overflow the oldest queued run is dropped with a warning
# and counted in GET_DATABASE_STATS. Unlike a trigger there is no client waiting, and a
# schedule fires again at its next occurrence.
scheduleQueueSize=100

# How often (ms) the scheduler wakes up to look for due schedules. Firing is never
# finer-grained than this, so a schedule whose intervalMs is below the tick fires once per
# tick. Valid number >= 1.
scheduleTickMs=1000

# How often (ms) the whole schedule registry is rebuilt from disk. The DDL path updates the
# registry directly; this is the safety net for schedules that arrived through cluster
# replication or admin anti-entropy. Valid number >= 1.
scheduleRefreshMs=60000

# Default max wall-clock milliseconds one scheduled run may take. A schedule may override
# it with its own timeoutMs. Valid number >= 1.
scheduleTimeoutMs=30000

# Max schedules one database may hold, so a SAVE_SCHEDULE loop cannot make the per-tick
# scan unbounded. Valid number >= 1.
scheduleMaxPerDatabase=100

# Memory bound on the cached schedule definitions. Same contract as procedureCacheMaxBytes:
# derived from disk, LRU-evicted, and budgeted separately from maxMemory. Human-readable
# size > 0.
scheduleCacheMaxBytes=8Mb

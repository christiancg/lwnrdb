name: Bug report
description: Something does not work the way the README says it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, or the commit if you built it yourself
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact requests you sent, in order, and any non default values in lwnrdb.cfg
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The response, including the error code, and anything useful from the logs
    validations:
      required: true

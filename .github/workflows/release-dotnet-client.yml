name: Release .NET client
on:
  push:
    tags:
      - 'dotnet-client-v*'

permissions:
  contents: write
  id-token: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  verify:
    name: Verify against the server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Package the server jar from the same commit
        working-directory: .
        run: mvn -B --no-transfer-progress -DskipTests package
      - name: Check formatting
        run: dotnet format Lwnrdb.slnx --verify-no-changes
      - name: Build
        run: dotnet build Lwnrdb.slnx -c Release
      - name: Unit tests with coverage
        run: dotnet test tests/Lwnrdb.Client.Tests -c Release -f net10.0 --no-build /p:CollectCoverage=true /p:Threshold=\"95,90\" /p:ThresholdType=\"line,branch\" /p:ThresholdStat=total
      - name: Unit tests (net11.0)
        run: dotnet test tests/Lwnrdb.Client.Tests -c Release -f net11.0 --no-build
      - name: Consumer
        run: |
          dotnet pack src/Lwnrdb.Client -c Release -o artifacts --no-build
          dotnet run --project consumers/Console
      - name: Integration tests
        run: LWNRDB_JAR="$GITHUB_WORKSPACE/target/lwnrdb.jar" dotnet test tests/Lwnrdb.Client.IntegrationTests -c Release --no-build

  publish:
    name: Publish to NuGet
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: clients/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Pack the version from the tag
        run: dotnet pack src/Lwnrdb.Client -c Release -o artifacts /p:Version="${VERSION#dotnet-client-v}" /p:ContinuousIntegrationBuild=true
      - name: Log in to NuGet through trusted publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
      - name: GitHub release
        run: |
          PRERELEASE=""
          case "${VERSION}" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "${VERSION}" --title ".NET client ${VERSION#dotnet-client-v}" --generate-notes ${PRERELEASE}

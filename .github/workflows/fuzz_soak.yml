name: Fuzz Soak
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: Soak minutes per shard
        default: '45'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Package
        run: mvn -B --no-transfer-progress package -DskipTests
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: lwnrdb-jar
          path: target/lwnrdb-1.0-SNAPSHOT.jar
          retention-days: 1

  soak:
    name: soak ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          architecture: x64
      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: lwnrdb-jar
          path: target
      - name: Soak on random seeds
        env:
          MINUTES: ${{ inputs.minutes || '45' }}
        run: |
          set -o pipefail
          python3 -u test_utils/test_fuzz.py --seed random --minutes "${MINUTES}" --shrink 600 --report "$GITHUB_STEP_SUMMARY" | tee fuzz-soak.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-soak-${{ matrix.shard }}
          path: fuzz-soak.log
          retention-days: 14

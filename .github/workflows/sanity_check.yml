name: Sanity Check
on:
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # Build once: compile, unit tests, coverage + all quality gates, then publish
  # the shaded jar as an artifact so the integration jobs don't have to rebuild.
  # This is the long pole; everything below runs in parallel against the jar.
  # ---------------------------------------------------------------------------
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Run Maven Verify
        # spotless.check.skip: temporary, until the flaky Eclipse P2 formatter download is fixed.
        run: mvn -B --no-transfer-progress -Dspotless.check.skip=true verify
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: lwnrdb-jar
          path: target/lwnrdb-1.0-SNAPSHOT.jar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Integration suites, fanned out across independent runners. Each leg gets its
  # own runner VM, so every leg can reuse port 8989 / the default db folder
  # without colliding, and the pgrep-based scripts (memory-extensive, bench) are
  # each the sole jar on their runner. The index suite needs caching disabled
  # (maxMemory=-1); tls and bench manage their own server lifecycle.
  # fail-fast: false so one failing suite doesn't cancel the others.
  # ---------------------------------------------------------------------------
  integration:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lightweight functional suites — share one default-config server.
          - name: auth-api-memory
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              python3 test_utils/test_auth.py
              python3 test_utils/test_api_commands.py
              python3 test_utils/test_memory_limits.py

          # Streaming / paged read paths.
          - name: streaming
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              STREAM_TEST_DOCS=2000 \
              STREAM_TEST_PAYLOAD_BYTES=512 \
              python3 test_utils/test_streaming_reads.py

          # Heavy mixed workload that measures RSS via pgrep -> must be sole jar.
          - name: memory-extensive
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              MEM_TEST_COLLECTIONS=4 \
              MEM_TEST_DOCS=2000 \
              MEM_TEST_PAYLOAD_BYTES=512 \
              python3 test_utils/test_memory_extensive.py

          # Index fast-paths are only visible when reads hit disk -> caching off.
          - name: index-aggregations
            start_server: true
            max_memory: "-1"
            xmx: 512m
            run: |
              INDEX_TEST_DOCS=2000 \
              INDEX_TEST_PAYLOAD_BYTES=512 \
              python3 test_utils/test_index_aggregations.py

          # Listenable queries: LISTEN / STOP_LISTEN push notifications.
          - name: listen
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              python3 test_utils/test_listen.py

          # Per-collection JSON Schema validation: SAVE_SCHEMA / DELETE_SCHEMA + write enforcement.
          - name: schema-validation
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              python3 test_utils/test_schema_validation.py

          # Transactions: START/COMMIT/ROLLBACK, read-your-writes, the table lock
          # held for the transaction's duration, and auto-rollback on disconnect.
          - name: transactions
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              python3 test_utils/test_transactions.py

          # Self-contained: starts/stops its own TLS server on 9443.
          - name: tls
            start_server: false
            run: |
              python3 test_utils/test_tls.py

          # Self-contained: starts/stops its own 3-node cluster (client ports
          # 8991-8993, cluster ports 9991-9993), each node in its own work dir.
          - name: clustering
            start_server: false
            run: |
              python3 test_utils/test_clustering.py

          # Self-contained: RUN_SCRIPT needs a configured script sandbox the shared
          # server does not have, and the suite restarts its own instance (port 8995)
          # with scriptsEnabled=false to prove the master switch.
          - name: run-script
            start_server: false
            run: |
              python3 test_utils/test_run_script.py

          # Self-contained for the same reason, on port 8996: procedures and triggers need
          # both scriptsEnabled and triggersEnabled, and the suite restarts its own instance
          # with each switch off to prove they refuse independently.
          - name: procedures-triggers
            start_server: false
            run: |
              python3 test_utils/test_procedures_triggers.py

          # Self-contained for the same reason, on port 8995: schedules need both
          # scriptsEnabled and schedulesEnabled, and the suite restarts its own instance
          # with the switch off to prove it refuses independently.
          - name: schedules
            start_server: false
            run: |
              python3 test_utils/test_schedules.py

          # Self-contained, on port 8997: the cap has to be a small known value for a
          # burst to reach it, and the suite restarts its own instance three times -
          # reject-immediately, absorb-by-waiting, and cap disabled as the control.
          - name: script-admission
            start_server: false
            run: |
              python3 test_utils/test_script_admission.py

          # Self-contained, on port 8998: LIST_SCRIPTS / CANCEL_SCRIPT need scripts, triggers and
          # schedules all enabled plus a deliberately generous script timeout (so a cancellation is
          # never mistaken for a timeout), and the suite restarts its own instance to prove a
          # cancelled trigger run is not replayed by startup recovery.
          - name: script-control
            start_server: false
            run: |
              python3 test_utils/test_script_control.py

          # Needs a server already up (it connects + loads data, then restarts
          # the server itself to measure cold-cache latency via pgrep).
          - name: cache-warmup-bench
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              BENCH_DOCS=5000 \
              BENCH_WARM_RUNS=10 \
              python3 test_utils/bench_cache_warmup.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          architecture: x64
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: lwnrdb-jar
          path: target
      - name: Set admin credentials for integration tests
        run: sed -i 's/^defaultAdminPassword=.*/defaultAdminPassword=administrator/' lwnrdb.cfg
      - name: Start server
        if: ${{ matrix.start_server }}
        run: |
          sed -i "s/^maxMemory=.*/maxMemory=${{ matrix.max_memory }}/" lwnrdb.cfg
          java -Xmx${{ matrix.xmx }} -jar target/lwnrdb-1.0-SNAPSHOT.jar > server.log 2>&1 &
          echo $! > server.pid
          for _ in $(seq 1 150); do
            nc -z 127.0.0.1 8989 && break
            sleep 0.2
          done
          if ! nc -z 127.0.0.1 8989; then
            echo "::error::server failed to start"; cat server.log; exit 1
          fi
      - name: Run ${{ matrix.name }} tests
        run: ${{ matrix.run }}
      - name: Stop server
        if: ${{ always() && matrix.start_server }}
        run: pkill -f lwnrdb-1.0-SNAPSHOT.jar || true

  # ---------------------------------------------------------------------------
  # test262 conformance. Its own job rather than an integration matrix row: the
  # matrix legs only download the shaded jar, while the worker JVM needs both
  # target/classes and target/test-classes. Runs outside mvn verify's critical
  # path because a conformance run must survive tests that hang or blow the JVM
  # stack. The corpus is fetched on demand and cached, never committed.
  # ---------------------------------------------------------------------------
  test262:
    name: test262 Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Compile (main + test classes)
        run: mvn -B --no-transfer-progress -DskipTests test-compile
      - name: Cache test262 corpus
        uses: actions/cache@v4
        with:
          path: test262
          key: test262-${{ hashFiles('config/test262.properties') }}
      - name: Fetch corpus
        run: python3 test_utils/test262.py --fetch
      - name: Driver self-test
        run: python3 test_utils/test262.py --self-test
      - name: Run conformance
        # 20s (vs the 10s local default): shared runners see CPU steal/oversubscription that can
        # inflate a CPU-heavy-but-finite test (e.g. the decodeURI/decodeURIComponent RFC 3629
        # combinatorial tests, ~2s warm-JVM locally) by 10x+, flagging it as a false HANG.
        run: python3 test_utils/test262.py --gate baseline --require-corpus --timeout 20
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-report
          path: test_log/test262-report.md
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Single aggregate gate. This is the check required by branch protection
  # (named "Verify" to match the existing rule): it succeeds only when the build
  # and every integration leg succeeded, so the split pipeline still reports one
  # green/red status to the PR. Runs even if a dependency fails (if: always())
  # so it reports failure instead of being skipped and leaving the check pending.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    needs: [build, integration, test262]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          echo "build=${{ needs.build.result }} integration=${{ needs.integration.result }} test262=${{ needs.test262.result }}"
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.integration.result }}" != "success" ] || [ "${{ needs.test262.result }}" != "success" ]; then
            echo "::error::one or more jobs failed"
            exit 1
          fi
          echo "All jobs succeeded."

name: Sanity Check
on:
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # Build once: compile, unit tests, coverage + all quality gates, then build the
  # GraalVM native image and publish it as an artifact so the integration jobs
  # don't have to rebuild. This is the long pole; everything below runs in
  # parallel against the native binary.
  #
  # JDK 25, not 26: GraalVM has no JDK 26 release, and the regex engine resolves
  # \p{...} against the build JDK's Unicode data - see the enforcer rule in pom.xml.
  # ---------------------------------------------------------------------------
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install native-image build dependencies
        # native-image links against the system C toolchain and zlib; these are
        # usually present on ubuntu-latest but install them explicitly so the
        # native build never fails on a missing dependency.
        run: sudo apt-get update && sudo apt-get install -y build-essential libz-dev
      - name: Run Maven Verify
        # spotless.check.skip: temporary, until the flaky Eclipse P2 formatter download is fixed.
        run: mvn -B --no-transfer-progress -Dspotless.check.skip=true verify
      - name: Build native image
        # GraalVM is JAVA_HOME (set by setup-graalvm), so the native-maven-plugin
        # finds native-image. Tests already ran in `verify`.
        run: mvn -B --no-transfer-progress -Pnative package -DskipTests
      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: lwnrdb-native
          path: target/lwnrdb
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Integration suites, fanned out across independent runners. Each leg gets its
  # own runner VM, so every leg can reuse port 8989 / the default db folder
  # without colliding, and the pgrep/pkill-based scripts (memory-extensive, bench)
  # are each the sole server on their runner. The index suite needs caching
  # disabled (maxMemory=-1); tls, bench and the script suites manage their own
  # server lifecycle. fail-fast: false so one failing suite doesn't cancel the others.
  #
  # Every leg runs against the GraalVM native executable downloaded from `build`,
  # which is what validates the META-INF/native-image reachability metadata end to
  # end. LWNRDB_SERVER_BIN points the suites that launch their own server at the
  # native binary; the shared server is launched from the same path so process
  # matching (pgrep/pkill) is consistent.
  # ---------------------------------------------------------------------------
  integration:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    env:
      LWNRDB_SERVER_BIN: ${{ github.workspace }}/target/lwnrdb
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-api-memory
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              python3 test_utils/test_auth.py
              python3 test_utils/test_api_commands.py
              python3 test_utils/test_memory_limits.py

          - name: streaming
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              STREAM_TEST_DOCS=2000 \
              STREAM_TEST_PAYLOAD_BYTES=512 \
              python3 test_utils/test_streaming_reads.py

          - name: memory-extensive
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              MEM_TEST_COLLECTIONS=4 \
              MEM_TEST_DOCS=2000 \
              MEM_TEST_PAYLOAD_BYTES=512 \
              python3 test_utils/test_memory_extensive.py

          - name: index-aggregations
            start_server: true
            max_memory: "-1"
            xmx: 512m
            run: |
              INDEX_TEST_DOCS=2000 \
              INDEX_TEST_PAYLOAD_BYTES=512 \
              python3 test_utils/test_index_aggregations.py

          - name: listen
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              python3 test_utils/test_listen.py

          - name: schema-validation
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              python3 test_utils/test_schema_validation.py

          - name: transactions
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              python3 test_utils/test_transactions.py

          - name: tls
            start_server: false
            run: |
              python3 test_utils/test_tls.py

          - name: clustering
            start_server: false
            run: |
              python3 test_utils/test_clustering.py

          - name: run-script
            start_server: false
            run: |
              python3 test_utils/test_run_script.py

          - name: procedures-triggers
            start_server: false
            run: |
              python3 test_utils/test_procedures_triggers.py

          - name: schedules
            start_server: false
            run: |
              python3 test_utils/test_schedules.py

          - name: script-admission
            start_server: false
            run: |
              python3 test_utils/test_script_admission.py

          - name: script-control
            start_server: false
            run: |
              python3 test_utils/test_script_control.py

          - name: aggregation-scripts
            start_server: false
            run: |
              python3 test_utils/test_aggregation_scripts.py

          - name: cache-warmup-bench
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              BENCH_DOCS=5000 \
              BENCH_WARM_RUNS=10 \
              python3 test_utils/test_cache_warmup_bench.py
    steps:
      - uses: actions/checkout@v4
      - name: Download native binary
        uses: actions/download-artifact@v4
        with:
          name: lwnrdb-native
          path: target
      - name: Restore executable bit
        # upload/download-artifact does not preserve the exec bit.
        run: chmod +x "$LWNRDB_SERVER_BIN"
      - name: Set admin credentials for integration tests
        run: sed -i 's/^defaultAdminPassword=.*/defaultAdminPassword=administrator/' lwnrdb.cfg
      - name: Start server
        if: ${{ matrix.start_server }}
        run: |
          sed -i "s/^maxMemory=.*/maxMemory=${{ matrix.max_memory }}/" lwnrdb.cfg
          # Native images honor -Xmx as a runtime arg.
          "$LWNRDB_SERVER_BIN" -Xmx${{ matrix.xmx }} > server.log 2>&1 &
          echo $! > server.pid
          for _ in $(seq 1 150); do
            nc -z 127.0.0.1 8989 && break
            sleep 0.2
          done
          if ! nc -z 127.0.0.1 8989; then
            echo "::error::server failed to start"; cat server.log; exit 1
          fi
      - name: Run ${{ matrix.name }} tests
        run: ${{ matrix.run }}
      - name: Stop server
        if: ${{ always() && matrix.start_server }}
        run: pkill -f "$LWNRDB_SERVER_BIN" || true

  # ---------------------------------------------------------------------------
  # test262 conformance. Its own job rather than an integration matrix row: the
  # matrix legs only download the native binary, while the worker JVM needs both
  # target/classes and target/test-classes. It runs on the same JDK the native
  # image is built from, because the engine resolves \p{...} against that JDK's
  # Unicode data - a different JDK here would measure a different engine. Runs
  # outside mvn verify's critical
  # path because a conformance run must survive tests that hang or blow the JVM
  # stack. The corpus is fetched on demand and cached, never committed.
  # ---------------------------------------------------------------------------
  test262:
    name: test262 Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile (main + test classes)
        run: mvn -B --no-transfer-progress -DskipTests test-compile
      - name: Cache test262 corpus
        uses: actions/cache@v4
        with:
          path: test262
          key: test262-${{ hashFiles('config/test262.properties') }}
      - name: Fetch corpus
        run: python3 test_utils/test262/test262.py --fetch
      - name: Driver self-test
        run: python3 test_utils/test262/test262.py --self-test
      - name: Run conformance
        run: python3 test_utils/test262/test262.py --gate baseline --require-corpus --timeout 20
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-report
          path: test_log/test262-report.md
          retention-days: 7

  verify:
    name: Verify
    needs: [build, integration, test262]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          echo "build=${{ needs.build.result }} integration=${{ needs.integration.result }} test262=${{ needs.test262.result }}"
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.integration.result }}" != "success" ] || [ "${{ needs.test262.result }}" != "success" ]; then
            echo "::error::one or more jobs failed"
            exit 1
          fi
          echo "All jobs succeeded."

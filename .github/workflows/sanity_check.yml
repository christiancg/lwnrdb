name: Sanity Check
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Run Maven Verify
        run: mvn -B --no-transfer-progress verify
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: lwnrdb-jar
          path: target/lwnrdb.jar
          retention-days: 1

  integration:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-api-memory
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              python3 test_utils/test_auth.py
              python3 test_utils/test_api_commands.py
              python3 test_utils/test_memory_limits.py

          - name: streaming
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              STREAM_TEST_DOCS=2000 \
              STREAM_TEST_PAYLOAD_BYTES=512 \
              python3 test_utils/test_streaming_reads.py

          - name: memory-extensive
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              MEM_TEST_COLLECTIONS=4 \
              MEM_TEST_DOCS=2000 \
              MEM_TEST_PAYLOAD_BYTES=512 \
              python3 test_utils/test_memory_extensive.py

          - name: index-aggregations
            start_server: true
            max_memory: "-1"
            xmx: 512m
            run: |
              INDEX_TEST_DOCS=2000 \
              INDEX_TEST_PAYLOAD_BYTES=512 \
              python3 test_utils/test_index_aggregations.py

          - name: listen
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              python3 test_utils/test_listen.py

          - name: schema-validation
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              python3 test_utils/test_schema_validation.py

          - name: transactions
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              python3 test_utils/test_transactions.py

          - name: tls
            start_server: false
            run: |
              python3 test_utils/test_tls.py

          - name: connection-limits
            start_server: false
            run: |
              python3 test_utils/test_connection_limits.py

          - name: client
            start_server: false
            run: |
              python3 test_utils/test_client.py

          - name: metadata-limits
            start_server: false
            run: |
              python3 test_utils/test_metadata_limits.py

          - name: clustering-replication
            start_server: false
            run: |
              python3 test_utils/test_clustering.py --group replication

          - name: clustering-scripts
            start_server: false
            run: |
              python3 test_utils/test_clustering.py --group scripts

          - name: clustering-failover
            start_server: false
            run: |
              python3 test_utils/test_clustering.py --group failover

          - name: clustering-faults
            start_server: false
            run: |
              python3 test_utils/test_clustering.py --group faults

          - name: clustering-recreate
            start_server: false
            run: |
              python3 test_utils/test_clustering.py --group recreate

          - name: run-script
            start_server: false
            run: |
              python3 test_utils/test_run_script.py

          - name: procedures-triggers
            start_server: false
            run: |
              python3 test_utils/test_procedures_triggers.py

          - name: schedules
            start_server: false
            run: |
              python3 test_utils/test_schedules.py

          - name: script-admission
            start_server: false
            run: |
              python3 test_utils/test_script_admission.py

          - name: script-control
            start_server: false
            run: |
              python3 test_utils/test_script_control.py

          - name: aggregation-scripts
            start_server: false
            run: |
              python3 test_utils/test_aggregation_scripts.py

          - name: storage-consistency
            start_server: false
            run: |
              python3 test_utils/test_storage_consistency.py

          - name: fuzz
            start_server: false
            run: |
              python3 test_utils/test_fuzz.py --self-test
              python3 test_utils/test_fuzz.py --seeds regression --budget 240 --shrink 120

          - name: cache-warmup-bench
            start_server: true
            max_memory: 512mb
            xmx: 1g
            run: |
              BENCH_DOCS=5000 \
              BENCH_WARM_RUNS=10 \
              python3 test_utils/test_cache_warmup_bench.py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          architecture: x64
      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: lwnrdb-jar
          path: target
      - name: Set admin credentials for integration tests
        run: echo "defaultAdminPassword=Tst-Admin-9xQ2mV" >> lwnrdb.cfg
      - name: Start server
        if: ${{ matrix.start_server }}
        run: |
          sed -i "s/^maxMemory=.*/maxMemory=${{ matrix.max_memory }}/" lwnrdb.cfg
          java -Xmx${{ matrix.xmx }} -jar target/lwnrdb.jar > server.log 2>&1 &
          echo $! > server.pid
          for _ in $(seq 1 150); do
            nc -z 127.0.0.1 8989 && break
            sleep 0.2
          done
          if ! nc -z 127.0.0.1 8989; then
            echo "::error::server failed to start"; cat server.log; exit 1
          fi
      - name: Run ${{ matrix.name }} tests
        run: ${{ matrix.run }}
      - name: Stop server
        if: ${{ always() && matrix.start_server }}
        run: pkill -f lwnrdb.jar || true

  test262:
    name: test262 Conformance (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Compile (main + test classes)
        run: mvn -B --no-transfer-progress -DskipTests test-compile
      - name: Cache test262 corpus
        uses: actions/cache@v6
        with:
          path: test262
          key: test262-${{ hashFiles('config/test262.properties') }}
      - name: Fetch corpus
        run: python3 test_utils/test262/test262.py --fetch
      - name: Driver self-test
        run: python3 test_utils/test262/test262.py --self-test
      - name: Run conformance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          setsid python3 test_utils/test262/test262.py --gate baseline --require-corpus --timeout 20 \
            --shard "${{ matrix.shard }}/4" &
          conformance=$!
          while kill -0 "$conformance" 2>/dev/null; do
            failed=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure" and (.name | startswith("test262") | not) and .name != "Verify") | .name' \
              2>/dev/null | head -n 1 || true)
            if [ -n "$failed" ]; then
              echo "::error::Stopping test262 Conformance because $failed failed"
              kill -TERM -- "-$conformance" 2>/dev/null || true
              wait "$conformance" 2>/dev/null || true
              exit 1
            fi
            sleep 30
          done
          wait "$conformance"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-report-${{ matrix.shard }}
          path: test_log/test262-report.md
          retention-days: 7

  verify:
    name: Verify
    needs: [build, integration, test262]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          echo "build=${{ needs.build.result }} integration=${{ needs.integration.result }} test262=${{ needs.test262.result }}"
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.integration.result }}" != "success" ] || [ "${{ needs.test262.result }}" != "success" ]; then
            echo "::error::one or more jobs failed"
            exit 1
          fi
          echo "All jobs succeeded."

name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v version="${VERSION#v}" '
            /^## \[/ { inside = index($0, "## [" version "]") == 1; next }
            /^\[[^]]+\]: / { inside = 0 }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION#v}]' section"
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Run Maven Verify
        run: mvn -B --no-transfer-progress verify -Drevision="${VERSION#v}"
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: lwnrdb-jar
          path: target/lwnrdb.jar
          retention-days: 1
      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

  github-release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lwnrdb-jar
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create release
        run: |
          mv lwnrdb.jar "lwnrdb-${VERSION#v}.jar"
          PRERELEASE=""
          case "${VERSION}" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "${VERSION}" "lwnrdb-${VERSION#v}.jar" --title "${VERSION}" --notes-file release-notes.md ${PRERELEASE}

  docker:
    name: Docker image
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          IMAGE=ghcr.io/christiancg/lwnrdb
          TAGS="-t ${IMAGE}:${VERSION#v}"
          case "${VERSION}" in *-*) ;; *) TAGS="${TAGS} -t ${IMAGE}:latest" ;; esac
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg REVISION="${VERSION#v}" ${TAGS} --push .

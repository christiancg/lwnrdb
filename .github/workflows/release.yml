name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Run Maven Verify
        run: mvn -B --no-transfer-progress verify -Drevision="${VERSION#v}"
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: lwnrdb-jar
          path: target/lwnrdb.jar
          retention-days: 1

  github-release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lwnrdb-jar
      - name: Create release
        run: |
          mv lwnrdb.jar "lwnrdb-${VERSION#v}.jar"
          gh release create "${VERSION}" "lwnrdb-${VERSION#v}.jar" --title "${VERSION}" --generate-notes

  docker:
    name: Docker image
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          docker build --build-arg REVISION="${VERSION#v}" -t ghcr.io/christiancg/lwnrdb:"${VERSION#v}" -t ghcr.io/christiancg/lwnrdb:latest .
          docker push ghcr.io/christiancg/lwnrdb:"${VERSION#v}"
          docker push ghcr.io/christiancg/lwnrdb:latest

# LWNRDB configuration.
# Lines starting with '#' and blank lines are ignored.
# All values are validated at startup; an invalid value logs a FATAL error
# and prevents the application from starting.

# TCP port (1-65535).
port=8989

# Max simultaneous connections. >= 0, where 0 means unlimited.
maxConnections=100

# Database files directory (must be writable).
filePath=db

# Background worker threads (>= 1).
backgroundProcessingThreads=10

# Log files directory (must be writable).
logPath=logs

# Max log files to retain (>= 1).
maxLogFiles=7

# Max page file size (human-readable, > 0, must be greater than maxEntrySize).
maxPageSize=2Mb

# Max document size (human-readable, > 0, must be smaller than maxPageSize).
maxEntrySize=1Mb

# Bootstrap admin credentials (both required; password >= 8 chars).
defaultAdminUsername=admin
defaultAdminPassword=administrator

# Cache budget (human-readable; 0 = unlimited, -1 = disabled).
maxMemory=512mb

# Ms a transactional write waits for a busy collection lock before aborting (409-5). >= 1.
transactionLockTimeoutMs=5000

# Wall-clock budget (ms) for a graceful shutdown: refuse new connections, release open transactions,
# drain the trigger and background-index queues. Keep it under the supervisor's SIGKILL grace period.
shutdownTimeoutMs=15000

# Enable TLS for all connections (true/false). When true, plaintext clients are rejected.
tlsEnabled=false

# PKCS12 keystore path. If missing while tlsEnabled=true, a self-signed dev keystore is generated here.
tlsKeystorePath=certs/lwnrdb.p12

# PKCS12 keystore password (required, non-blank, when tlsEnabled=true).
tlsKeystorePassword=change_it

# --- Clustering (multi-node). All keys below are ignored unless clusterEnabled=true. ---
# Enable multi-node clustering (true/false). When false the node runs standalone.
clusterEnabled=false
# Node-to-node TCP port (must differ from port).
clusterPort=9990
# Interface the cluster server binds to.
clusterBindAddress=0.0.0.0
# Address other nodes use to reach this node.
clusterAdvertisedAddress=127.0.0.1
# Comma-separated seed nodes as host:port (empty on the first node).
clusterSeeds=
# Stable node id (empty = auto-generate and persist under filePath/cluster/node.id).
nodeId=
# Baseline cluster size for the write-quorum majority until membership stabilizes (>= 1).
clusterExpectedSize=1
# Gossip/heartbeat cadence in ms (>= 1).
gossipIntervalMs=1000
# Ms without hearing from a node before it is marked SUSPECT (>= 1).
suspectTimeoutMs=5000
# Ms without hearing from a node before it is marked DEAD (must be > suspectTimeoutMs).
deadTimeoutMs=15000
# Max ms a write waits for the replication quorum before failing (>= 1).
replicationAckTimeoutMs=5000
# Virtual nodes per physical node on the consistent-hash ring (>= 1).
virtualNodesPerNode=128
# Serve reads from the local replica when the owner is unreachable (true/false).
readFallbackToLocal=true
# Forward a script (RUN_SCRIPT/CALL_PROCEDURE) to a live node chosen by current script load (true/false).
# On by default; set false to keep every script on the node that received it. Roll every node when
# upgrading before the first script runs.
scriptRoutingEnabled=true
# TLS-encrypt the node-to-node channel (true/false).
clusterTlsEnabled=false
# Shared secret authenticating the cluster channel (required when clusterEnabled=true).
clusterSecret=
# How often (ms) each node runs a background anti-entropy sweep (>= 1).
antiEntropyIntervalMs=60000
# How long (ms) delete tombstones are kept before anti-entropy GC (>= 1); must exceed max node downtime.
tombstoneRetentionMs=86400000

# --- Stored scripts (SimpleJS). ---
# IANA time zone a script's Date/Temporal/toLocaleString answers in (a valid ZoneId, e.g. UTC).
# Fixed so the same script returns the same answer on every cluster node.
scriptTimeZone=UTC
# BCP 47 language tag a script's locale-sensitive formatting uses (e.g. en-US).
scriptLocale=en-US
# Whether clients may run scripts at all (RUN_SCRIPT, and procedure install/call). On by
# default; still requires admin, database ownership or scriptPermissions, and the sandbox
# below is server-fixed. Off refuses the operations with 403-2.
scriptsEnabled=true
# Max interpreter instructions per script run (>= 1); exceeding it aborts with 400-11.
scriptInstructionBudget=10000000
# Max wall-clock ms per script run (>= 1); exceeding it aborts with 408-1.
scriptTimeoutMs=5000
# Max nested call depth per script run (>= 1).
scriptMaxDepth=200
# Max accepted script source size (human-readable, > 0); larger is rejected with 400-10.
scriptMaxSourceBytes=256Kb
# Max console lines returned with the response (>= 1); newest lines win.
scriptMaxLogLines=1000
# Max characters kept per returned console line (>= 1).
scriptMaxLogLineChars=4096
# Max bulk memory a script run may allocate (human-readable, > 0); exceeding it aborts with 400-12.
scriptMaxMemoryBytes=64Mb
# Whether a script may evaluate a string as a module (script module's importText).
scriptTextImportEnabled=false
# Whether a script may import a stored procedure as a module: import ... from "procedures/<name>".
scriptProcedureImportEnabled=true
# Max size of the value a script returns (human-readable, > 0); larger fails with 400-15.
scriptMaxResultBytes=16Mb
# Default number of documents db.cursor fetches per batch (>= 1).
scriptCursorBatchSize=500
# Upper clamp for a caller-supplied db.cursor batchSize (>= scriptCursorBatchSize).
scriptCursorMaxBatchSize=5000
# Instruction budget shared by every SCRIPT operator in one AGGREGATE pipeline (400-11).
# Per-pipeline, not per-document: one interpreter serves the whole query.
aggregationScriptInstructionBudget=1000000
# Wall clock for the same set of operators, also per pipeline (408-1).
aggregationScriptTimeoutMs=2000
# Max source size of a single SCRIPT operator inside a pipeline (400-10).
aggregationScriptMaxSourceBytes=16Kb
# Max client-initiated script runs (RUN_SCRIPT/CALL_PROCEDURE) executing at once. Times
# scriptMaxMemoryBytes is the worst-case script heap, additive with maxMemory and the
# metadata caches. Triggers and schedules are capped separately by triggerThreads and
# scheduleThreads and are exempt from this. >= 0; 0 disables the cap.
maxConcurrentScripts=16
# Milliseconds a script run waits for a permit before it is rejected with 503-6. May
# exceed scriptTimeoutMs. >= 0; 0 rejects immediately.
scriptQueueWaitMs=250
# Max concurrent script runs for one user, and for one database, acquired inside the node-wide
# maxConcurrentScripts permit. They bound one tenant's share of the node so a single caller cannot
# hold every interpreter. Unlike the node-wide cap these do not wait: a caller already at its own
# ceiling is refused at once with 503-6 naming the scope, rather than occupying a node-wide permit
# while it queues. Triggers and scheduled procedures are exempt, as they are from the node-wide
# cap. Valid number >= 0; 0 disables that slice.
maxConcurrentScriptsPerUser=0
maxConcurrentScriptsPerDatabase=0

# Parsed ad-hoc RUN_SCRIPT programs retained per node, keyed by a hash of the source (>= 0);
# 0 parses on every call. A stored procedure uses procedureCacheSize instead.
scriptCompiledCacheSize=128

# Whether scripts may make outbound HTTP requests with `fetch`. On by default so the capability is
# discoverable. Reachable from RUN_SCRIPT, CALL_PROCEDURE, triggers and scheduled procedures; never
# from a pipeline script or a before-write hook, both of which run holding collection locks.
scriptFetchEnabled=true
# Hosts a script may reach, comma-separated: an exact host (api.example.com), a wildcard matching
# sub-domains but not the apex (*.example.com), or a bare * for every host; an EMPTY list denies.
# Ships as * so fetch works out of the box, and the server warns at every startup. NARROW IT: the
# request leaves from inside your perimeter, so * reaches internal services and cloud metadata
# endpoints (169.254.169.254), not just the public internet.
scriptFetchAllowlist=*
# Max wall-clock ms one fetch may take before it fails as a catchable TypeError (> 0).
scriptFetchTimeoutMs=5000
# Max bytes of a single response body; a larger one fails the call (human-readable, > 0).
scriptFetchMaxResponseBytes=1Mb

# Record each finished script run as a document in the reserved `script_runs` collection of the
# database it ran against, so what ran, what it cost and why it failed is queryable with an
# ordinary AGGREGATE. Created lazily on the first row; writes are async and best-effort.
scriptRunHistoryEnabled=true
# Which run kinds are recorded (comma-separated: CALL_PROCEDURE, TRIGGER, SCHEDULE, RUN_SCRIPT,
# BEFORE_HOOK). Ad-hoc RUN_SCRIPT is off by default so an exploratory client cannot flood it;
# BEFORE_HOOK records refusals only.
scriptRunHistoryKinds=CALL_PROCEDURE,TRIGGER,SCHEDULE
# How long (ms) a history row is kept before the hourly owner-only sweep deletes it (> 0).
scriptRunHistoryRetentionMs=604800000
# Whether a run's captured console output travels into its history row.
scriptRunHistoryIncludeLogs=false
# Max characters of a failed run's error message kept on its row (> 0).
scriptRunHistoryMaxErrorChars=2000

# --- Stored procedures and triggers. ---
# Compiled stored procedures retained per node (>= 0); 0 compiles on every call.
procedureCacheSize=128
# Memory bound on cached procedure sources (human-readable, > 0). Separate from maxMemory,
# which bounds the user document/index cache only; these caches are LRU-evicted from disk.
procedureCacheMaxBytes=32Mb
# Memory bound on cached per-collection JSON Schemas (human-readable, > 0).
schemaCacheMaxBytes=32Mb
# Max collections whose trigger list is cached (>= 0); 0 reads from disk every time.
triggerCacheMaxEntries=4096
# Max remembered "does not exist" answers for procedures/schemas (>= 0); kept apart so a
# flood of unknown names cannot evict the entries actually in use.
metadataMissCacheMaxEntries=4096
# Whether committed writes fire triggers. Off by default; separate from scriptsEnabled
# because a trigger runs code with no client asking for it.
triggersEnabled=false
# Workers on the trigger executor (>= 1); its own pool, not the background index queue.
triggerThreads=2
# Bounded trigger queue (>= 1); on overflow the oldest queued event is dropped with a warning.
triggerQueueSize=10000
# How deep a chain of trigger-fired writes may go (>= 0).
triggerMaxDepth=3
# Max wall-clock ms a single trigger run may take (>= 1).
triggerTimeoutMs=1000
# Record a fired trigger durably before it runs, so a run queued when the process dies is
# replayed at startup. Effects and record consumption commit together, so a replay cannot
# double-apply. Turning this off trades that guarantee for one less admin write per trigger.
triggerRunLogEnabled=true
# How long (ms) a pending trigger run record is kept before being GC'd as stranded (>= 1).
triggerRunRetentionMs=86400000
# Total attempts for a failed after-trigger, counting the first delivery (>= 1). A run whose
# script threw or whose effects could not be committed is retried after a backoff and then
# dead-lettered: its record is kept with status=DEAD for LIST_TRIGGER_RUNS / RESOLVE_TRIGGER_RUN.
# 1 means no retry, so the first failure dead-letters at once.
triggerMaxAttempts=3
# Backoff (ms) before the second attempt, doubled per attempt after it (>= 0).
triggerRetryBackoffMs=1000
# Ceiling (ms) the doubling backoff is clamped to (>= 0).
triggerRetryMaxBackoffMs=60000
# How long (ms) a dead-lettered run is kept (> 0). Longer than triggerRunRetentionMs on purpose:
# it is waiting for a human, so the pending clock would discard the evidence too soon.
triggerDeadLetterRetentionMs=604800000

# Instruction budget for a before-write hook: the whole of one request, not one document, so a
# BULK_SAVE of N documents shares this budget rather than getting a fresh one per row. A client
# write is blocked while a hook runs, so this is deliberately an order below
# scriptInstructionBudget. Must be >= 1.
beforeHookInstructionBudget=200000

# Max wall-clock milliseconds all the before-write hooks of one request may take together. A hook
# that exhausts it rejects the write (fail-closed): a hook that could not run must never let a
# write through. Must be >= 1.
beforeHookTimeoutMs=200

# --- Scheduled procedures. ---
# Whether schedules fire. On by default; a scheduled run executes code with no client
# asking for it, and with its installer's authority. Nothing runs until somebody installs a
# schedule, and installing one needs scriptsEnabled for the procedure it names.
schedulesEnabled=true
# Workers running scheduled procedures (>= 1); its own pool, not the trigger queue.
scheduleThreads=2
# Bounded due-run queue (>= 1); on overflow the oldest queued run is dropped with a warning.
scheduleQueueSize=100
# How often (ms) the scheduler wakes to look for due schedules (>= 1). Firing is never
# finer-grained than this, so a schedule whose intervalMs is below it fires once per tick.
scheduleTickMs=1000
# How often (ms) the registry is rebuilt from disk (>= 1); the safety net for schedules
# arriving through cluster replication or admin anti-entropy.
scheduleRefreshMs=60000
# Default max wall-clock ms one scheduled run may take (>= 1); a schedule may lower or
# raise it with its own timeoutMs.
scheduleTimeoutMs=30000
# Max schedules one database may hold (>= 1), so the per-tick scan stays bounded.
scheduleMaxPerDatabase=100
# Memory bound on cached schedule definitions (human-readable, > 0). Same contract as
# procedureCacheMaxBytes: derived from disk and LRU-evicted.
scheduleCacheMaxBytes=8Mb

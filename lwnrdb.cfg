# LWNRDB configuration.
# Lines starting with '#' and blank lines are ignored.
# All values are validated at startup; an invalid value logs a FATAL error
# and prevents the application from starting.

# TCP port (1-65535).
port=8989

# Max simultaneous connections. >= 0, where 0 means unlimited.
maxConnections=100

# Database files directory (must be writable).
filePath=db

# Background worker threads (>= 1).
backgroundProcessingThreads=10

# Log files directory (must be writable).
logPath=logs

# Max log files to retain (>= 1).
maxLogFiles=7

# Max page file size (human-readable, > 0, must be greater than maxEntrySize).
maxPageSize=2Mb

# Max document size (human-readable, > 0, must be smaller than maxPageSize).
maxEntrySize=1Mb

# Bootstrap admin credentials (both required; password >= 8 chars).
defaultAdminUsername=admin
defaultAdminPassword=administrator

# Cache budget (human-readable; 0 = unlimited, -1 = disabled).
maxMemory=512mb

# Ms a transactional write waits for a busy collection lock before aborting (409-5). >= 1.
transactionLockTimeoutMs=5000

# Enable TLS for all connections (true/false). When true, plaintext clients are rejected.
tlsEnabled=false

# PKCS12 keystore path. If missing while tlsEnabled=true, a self-signed dev keystore is generated here.
tlsKeystorePath=certs/lwnrdb.p12

# PKCS12 keystore password (required, non-blank, when tlsEnabled=true).
tlsKeystorePassword=change_it

# --- Clustering (multi-node). All keys below are ignored unless clusterEnabled=true. ---
# Enable multi-node clustering (true/false). When false the node runs standalone.
clusterEnabled=false
# Node-to-node TCP port (must differ from port).
clusterPort=9990
# Interface the cluster server binds to.
clusterBindAddress=0.0.0.0
# Address other nodes use to reach this node.
clusterAdvertisedAddress=127.0.0.1
# Comma-separated seed nodes as host:port (empty on the first node).
clusterSeeds=
# Stable node id (empty = auto-generate and persist under filePath/cluster/node.id).
nodeId=
# Baseline cluster size for the write-quorum majority until membership stabilizes (>= 1).
clusterExpectedSize=1
# Gossip/heartbeat cadence in ms (>= 1).
gossipIntervalMs=1000
# Ms without hearing from a node before it is marked SUSPECT (>= 1).
suspectTimeoutMs=5000
# Ms without hearing from a node before it is marked DEAD (must be > suspectTimeoutMs).
deadTimeoutMs=15000
# Max ms a write waits for the replication quorum before failing (>= 1).
replicationAckTimeoutMs=5000
# Virtual nodes per physical node on the consistent-hash ring (>= 1).
virtualNodesPerNode=128
# Serve reads from the local replica when the owner is unreachable (true/false).
readFallbackToLocal=true
# TLS-encrypt the node-to-node channel (true/false).
clusterTlsEnabled=false
# Shared secret authenticating the cluster channel (required when clusterEnabled=true).
clusterSecret=
# How often (ms) each node runs a background anti-entropy sweep (>= 1).
antiEntropyIntervalMs=60000
# How long (ms) delete tombstones are kept before anti-entropy GC (>= 1); must exceed max node downtime.
tombstoneRetentionMs=86400000

# --- Stored scripts (SimpleJS). ---
# IANA time zone a script's Date/Temporal/toLocaleString answers in (a valid ZoneId, e.g. UTC).
# Fixed so the same script returns the same answer on every cluster node.
scriptTimeZone=UTC
# BCP 47 language tag a script's locale-sensitive formatting uses (e.g. en-US).
scriptLocale=en-US

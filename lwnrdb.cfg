# LWNRDB configuration — site overrides only.
#
# Every key, its default and what it does are documented in the bundled default.cfg
# (src/main/resources/default.cfg); this file only needs the values this deployment
# changes. Anything absent here falls back to that default, and every value is validated
# at startup — an invalid one logs a FATAL error and prevents the application starting.

# TCP port (1-65535).
port=8989

# Database files directory (must be writable).
filePath=db

# Log files directory (must be writable).
logPath=logs

# Bootstrap admin credentials (both required; password >= 8 chars).
# CHANGE THESE before exposing the server.
defaultAdminUsername=admin
defaultAdminPassword=administrator

# Cache budget (human-readable; 0 = unlimited, -1 = disabled).
maxMemory=512mb

# Hosts a script may reach with `fetch`, comma-separated: an exact host, a wildcard
# (*.example.com), or a bare * for every host; an EMPTY list denies. Ships as * so fetch
# works out of the box, and the server warns at every startup. NARROW IT: the request
# leaves from inside your perimeter, so * reaches internal services and cloud metadata
# endpoints (169.254.169.254), not just the public internet.
scriptFetchAllowlist=*
